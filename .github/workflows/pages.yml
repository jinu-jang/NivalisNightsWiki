name: Publish guide frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'web/**'
      - 'published-data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Compose static site
        shell: pwsh
        run: |
          Copy-Item -Path web -Destination _site -Recurse
          if (Test-Path published-data/catalog.json) {
            Remove-Item -Path _site/data -Recurse -Force
            Copy-Item -Path published-data -Destination _site/data -Recurse
          }
          New-Item -Path _site/.nojekyll -ItemType File -Force | Out-Null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
